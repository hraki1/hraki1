<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ahmad Alhraki — Software Engineer and Full-Stack Developer">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0A0E1C"/>
    </linearGradient>

    <!-- Accent gradient (cyan -> indigo -> violet) -->
    <linearGradient id="accent" x1="70" y1="120" x2="720" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Dot grid -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#4C566A" fill-opacity="0.18"/>
    </pattern>

    <!-- Soft glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Base -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- Depth glows -->
    <ellipse cx="1000" cy="70" rx="360" ry="260" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="300" rx="320" ry="200" fill="url(#glow2)">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Left accent bar -->
    <rect x="70" y="96" width="6" height="128" rx="3" fill="url(#bar)"/>

    <!-- Terminal chrome dots -->
    <circle cx="112" cy="70" r="6" fill="#FF5F57"/>
    <circle cx="134" cy="70" r="6" fill="#FEBC2E"/>
    <circle cx="156" cy="70" r="6" fill="#28C840"/>
    <text x="182" y="75" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15" fill="#5B6478">ahmad@dev: ~/portfolio</text>

    <!-- Name -->
    <text x="100" y="158" font-family="'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" font-size="66" font-weight="800" fill="#F4F6FB" letter-spacing="-1">Ahmad Alhraki</text>

    <!-- Subtitle -->
    <text x="102" y="200" font-family="'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="600" fill="#C3CAD9">Software Engineer
      <tspan fill="#5B6478">&#160;&#160;·&#160;&#160;</tspan>
      <tspan fill="url(#accent)">Full-Stack Developer</tspan>
    </text>

    <!-- Terminal prompt line with blinking cursor -->
    <g font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="18">
      <text x="102" y="248" fill="#7C8698">$</text>
      <text x="122" y="248" fill="#8A93A6">building scalable web apps, <tspan fill="#22D3EE">end-to-end</tspan></text>
      <rect x="470" y="234" width="11" height="20" fill="#22D3EE">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Decorative code bracket motif (right) -->
    <g opacity="0.9" font-family="ui-monospace, monospace" font-weight="700">
      <text x="920" y="150" font-size="150" fill="#151B2C">&lt;/&gt;</text>
    </g>

    <!-- Floating tech chips (right) -->
    <g font-family="ui-monospace, monospace" font-size="14" font-weight="600">
      <g transform="translate(930,210)">
        <rect width="86" height="30" rx="15" fill="#0F1628" stroke="#22D3EE" stroke-opacity="0.4"/>
        <text x="43" y="20" fill="#22D3EE" text-anchor="middle">React</text>
        <animateTransform attributeName="transform" type="translate" values="930,210; 930,204; 930,210" dur="5s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g transform="translate(1028,210)">
        <rect width="96" height="30" rx="15" fill="#0F1628" stroke="#A855F7" stroke-opacity="0.4"/>
        <text x="48" y="20" fill="#C084FC" text-anchor="middle">NestJS</text>
        <animateTransform attributeName="transform" type="translate" values="1028,210; 1028,216; 1028,210" dur="5s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g transform="translate(978,250)">
        <rect width="112" height="30" rx="15" fill="#0F1628" stroke="#6366F1" stroke-opacity="0.5"/>
        <text x="56" y="20" fill="#818CF8" text-anchor="middle">TypeScript</text>
        <animateTransform attributeName="transform" type="translate" values="978,250; 978,244; 978,250" dur="6s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <!-- Bottom accent line -->
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
